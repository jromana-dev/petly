services:

  frontend:
    build:
      context: ./frontend
    container_name: petly-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: petly-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    restart: unless-stopped